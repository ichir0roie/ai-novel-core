# ワークフローの action は commit の SHA で、python のパッケージは requirements.txt で版を固定している。
# 固定したままだと更新が止まるので、Dependabot に新しい版の PR を出させる
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
