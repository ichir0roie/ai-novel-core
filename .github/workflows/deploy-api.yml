# main に API(gui/api)と、それが読むコードの変更が入ったら、Lambda のコンテナを作り直し、db のマイグレーションを流してから差し替える。
# AWS へは OIDC で一時的な権限をもらう(鍵を GitHub に置かない)。設定の手順は `.docs/ci-cd.md`。
# リポジトリの変数(Settings → Secrets and variables → Actions → Variables)が無ければ何もしない(フォーク・設定前)。
# ロールの ARN と関数 URL は、公開のログに出さないよう秘密(Secrets)から読む。job の if は秘密を読めないので変数で判定する。
name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - "ai/**"
      - "data_access_logic/**"
      - "db/**"
      - "randomizer/**"
      - "gui/__init__.py"
      - "gui/api/**"
      - "requirements.txt"
      - "infra/lambda/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.LAMBDA_FUNCTION_NAME != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: lint
        run: pipx run ruff check .

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Lambda は複数アーキの目録(provenance の添付で出来る)を受け付けないので、一つのアーキだけで push する。
      # main の tag は infra/(CDK)が関数を作るときに指す先。関数の差し替えは commit の sha の tag で行う
      - name: build and push
        env:
          REPOSITORY: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
        run: |
          docker buildx build --platform linux/amd64 --provenance=false \
            -f infra/lambda/Dockerfile -t "$REPOSITORY:${{ github.sha }}" -t "$REPOSITORY:main" --push .
          echo "IMAGE=$REPOSITORY:${{ github.sha }}" >> "$GITHUB_ENV"

      # db を先に、API を後に変える(列を足す変更で、新しい API がまだ無い列を読まないように)。
      # マイグレーションの関数(novel-migrate)を同じイメージに差し替えて呼び、イメージに入っているバージョンまで流す。
      # 関数の名前の変数が無ければ(関数を作る前・フォーク)飛ばす。
      # 呼び出しは返事まで何も流れないので、長いマイグレーションでは途中の経路が無通信の接続を黙って切り、
      # CLI が待ち続ける(2026-10-02 に 9 分のマイグレーションで 6 時間待った)。keepalive を短くして接続を保ち、
      # それでも切れたときは Lambda のタイムアウト(15 分)を過ぎたところで諦める
      - name: migrate db
        if: vars.MIGRATION_FUNCTION_NAME != ''
        env:
          FUNCTION: ${{ vars.MIGRATION_FUNCTION_NAME }}
        run: |
          sudo sysctl -q -w net.ipv4.tcp_keepalive_time=60 net.ipv4.tcp_keepalive_intvl=30
          aws configure set tcp_keepalive true
          aws lambda update-function-code --function-name "$FUNCTION" \
            --image-uri "$IMAGE" --output text --query 'LastUpdateStatus'
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"
          aws lambda invoke --function-name "$FUNCTION" --cli-read-timeout 960 \
            --cli-binary-format raw-in-base64-out --payload '{}' result.json > invoke.json
          cat result.json; echo
          if jq -e '.FunctionError' invoke.json > /dev/null; then exit 1; fi
          jq -e '.after != null and .after == .head' result.json > /dev/null

      - name: update lambda
        run: |
          aws lambda update-function-code --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --image-uri "$IMAGE" --output text --query 'LastUpdateStatus'
          aws lambda wait function-updated-v2 --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"

      # 関数 URL の認証は AWS_IAM なので、引き受けたロールの一時的な鍵で SigV4 の署名を付ける
      - name: smoke test
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then exit 0; fi
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            --aws-sigv4 "aws:amz:${{ vars.AWS_REGION }}:lambda" \
            --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" \
            -H "x-amz-security-token: $AWS_SESSION_TOKEN" \
            "$API_BASE_URL/api/ping"
