# AWS Amplify Hosting のビルド設定。画面(gui/web、Next.js)だけをモノレポの一つのアプリとして建てる。
# Amplify のアプリの環境変数に AMPLIFY_MONOREPO_APP_ROOT=gui/web、NOVEL_API_URL、NOVEL_API_KEY を置く(`.docs/aws-deploy.md`)。
version: 1
applications:
  - appRoot: gui/web
    frontend:
      phases:
        preBuild:
          commands:
            # package-lock.json は手元の npm 11(Node 24)で作る。npm 10 の npm ci はそれを食い違いとして拒む
            - nvm install 24 && nvm use 24
            - npm ci
        build:
          commands:
            # サーバー側(`app/api/[...path]/route.ts`)が実行時に読む値は、ビルドの環境変数から .env.production に写す
            - env | grep -E '^NOVEL_(API_URL|API_KEY)=' >> .env.production || true
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
